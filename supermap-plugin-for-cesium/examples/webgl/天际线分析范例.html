<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <title>天际线分析</title>
  <link href="./css/pretty.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
  <script src="./js/config.js"></script>
  <script type="text/javascript" src="./js/jquery.min.js"></script>
  <script type="text/javascript" src="./js/echarts.min.js"></script>
  <!-- 引入原生Cesium和SuperMap插件 -->
  <link href="../../Build/Cesium-1.133/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="../../Build/Cesium-1.133/Cesium/Cesium.js"></script>
  <script src="../../Build/SuperMapCesiumPlugin/SuperMapCesiumPlugin.js"></script>
</head>

<body>
  <div id="cesiumContainer"></div>
  <div id="loadingbar" class="spinner">
    <div class="spinner-container container1">
      <div class="circle1"></div>
      <div class="circle2"></div>
      <div class="circle3"></div>
      <div class="circle4"></div>
    </div>
    <div class="spinner-container container2">
      <div class="circle1"></div>
      <div class="circle2"></div>
      <div class="circle3"></div>
      <div class="circle4"></div>
    </div>
    <div class="spinner-container container3">
      <div class="circle1"></div>
      <div class="circle2"></div>
      <div class="circle3"></div>
      <div class="circle4"></div>
    </div>
  </div>

  <div id="toolbar" class="param-container tool-bar">
    <button type="button" id="chooseView" class="button black">提取天际线</button>
    <button type="button" id="getSkyline2D" class="button black">二维天际线</button>
    <button type="button" id="setLimitBody" class="button black">绘制限高体</button>
    <button type="button" id="getSkylineArea" class="button black">拉伸闭合体</button>
    <button type="button" id="clear" class="button black">清除</button>
</div>
<div id="map" style="position : absolute;right : 5%; bottom : 5%;width:450px;height:400px;"></div>


  <script>
    function onload(Cesium, SuperMapCesiumPlugin) {
      if (SuperMapCesiumPlugin === undefined) {
        return;
      }
      $("#loadingbar").remove();
      const viewer = new Cesium.Viewer("cesiumContainer");
      const cesiumScene = viewer.scene;
      cesiumScene.logarithmicDepthBuffer = true;
      cesiumScene.globe.show = true;

      async function loadS3M(){
        const url = "http://172.16.120.103:8090/iserver/services/3D-CBDtest/rest/realspace";
        const supermapPluginViewer = new SuperMapCesiumPlugin.CesiumViewer({
          scene: cesiumScene
        });
        const suepMapScene = supermapPluginViewer.scene;
        let layers = await suepMapScene.open(url);
        for (let i = 0; i < layers.length; i++) {
          layers[i].selectEnabled = false;
        }
      }

      async function load3DTiles(){
        //这是超图生成的3d tiles，加载这个数据有问题
        // var tiles3Durl = "http://localhost:8090/iserver/services/3D-ThreeDTilesCache-tileset_whole/rest/realspace/datas/tileset_whole/config";
        var tilesetUrl = './data/Cesium3DTiles/Batched/BatchedColors/tileset.json';
     
        let tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl)
        cesiumScene.primitives.add(tileset);
        viewer.zoomTo(tileset);
      }
  
      async function loadModel(){
        await loadS3M();
        // await load3DTiles();
        const skyline = new SuperMapCesiumPlugin.Skyline(cesiumScene);//创建天际线分析对象
        const handler = new Cesium.ScreenSpaceEventHandler(cesiumScene.canvas);
        let cartesian3s = []; //限高点集合
        let drawLimitBodyActive = false;
        
        //鼠标点击事件，添加点
        handler.setInputAction(function (e) {
          if(!drawLimitBodyActive){
            return;
          }
          let position = cesiumScene.pickPosition(e.position);
          if(position !== undefined){
            cartesian3s.push(position);
          }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        handler.setInputAction(function (e) {
          if(!drawLimitBodyActive){
            return;
          }
          onDrawedEnd(); 
          drawLimitBodyActive = false;
        }, Cesium.ScreenSpaceEventType.RIGHT_CLICK);
        function onDrawedEnd(){
          // 清除之前的限高体对象
          skyline.removeLimitbody("limitBody");
    
          let pos = cartesian3s;
          let positions = [];
          // 遍历多边形，取出所有点
          for (let i = 0, len = pos.length; i < len; i++) {
            //转化为经纬度，并加入至临时数组
            let cartographic = Cesium.Cartographic.fromCartesian(pos[i]);
            let longitude = Cesium.Math.toDegrees(cartographic.longitude);
            let latitude = Cesium.Math.toDegrees(cartographic.latitude);

            positions.push([longitude, latitude]);
          }
          //去除重复点
          positions = unique(positions);
          let arr = [];
          //再次遍历转化为接口所需的数组格式
          for (let i = 0, len = positions.length; i < len; i++) {
              arr.push(positions[i][0]);
              arr.push(positions[i][1]);
          }

          //添加限高体对象
          skyline.addLimitbody({
              position: arr,
              name: "limitBody"
          });
        }
        //去重函数
        function unique(arr) {
            let res = [];
            let json = {};
            for (let i = 0; i < arr.length; i++) {
                if (!json[arr[i]]) {
                    res.push(arr[i]);
                    json[arr[i]] = 1;
                }
            }
            return res;
        };
      
        function mousestyle() { //鼠标样式
          viewer.enableCursorStyle = false;
          viewer._element.style.cursor = '';
          $('body').removeClass('drawCur').addClass('drawCur');
        }

        $('#chooseView').click(function () {
          const cesiumCamera = cesiumScene.camera;
          let cartographic = cesiumCamera.positionCartographic;
          let longitude = Cesium.Math.toDegrees(cartographic.longitude);
          let latitude = Cesium.Math.toDegrees(cartographic.latitude);
          let height = cartographic.height;

          //天际线分析的视口位置设置成当前相机位置
          skyline.viewPosition = [longitude, latitude, height];
          //设置俯仰和方向
          skyline.pitch = Cesium.Math.toDegrees(cesiumCamera.pitch);
          skyline.direction = Cesium.Math.toDegrees(cesiumCamera.heading);
          skyline.radius = 10000; // 天际线分析半径设置为10000米
          skyline.build();
          $("#getSkyline2D").show();
          $("#setLimitBody").show();
          $("#map").hide();
        });

        $('#setLimitBody').click(function () {
          if(drawLimitBodyActive){
            return;
          }
          drawLimitBodyActive = true;
        });
            
        $('#clear').click(function () {
          viewer.entities.removeAll();
          skyline.clear();
          cartesian3s = [];
          $("#map").hide();
        });

        $('#getSkylineArea').click(function () {
          const cesiumCamera = cesiumScene.camera;
          let cartographic = cesiumCamera.positionCartographic;
          let longitude = Cesium.Math.toDegrees(cartographic.longitude);
          let latitude = Cesium.Math.toDegrees(cartographic.latitude);
          let height = cartographic.height;
          let points = skyline.getSkyline3D();
          let pointArr = new Array();
          let cameraPoint = Cesium.Cartesian3.fromDegrees(longitude, latitude, height);
          pointArr.push(cameraPoint);
          for (let i = 0; i < points.x.length; i++) {
              let point = Cesium.Cartesian3.fromDegrees(points.x[i], points.y[i], points.z[i]);
              pointArr.push(point);
          }
          viewer.entities.add({
              polygon: {
                  extrudedHeight: 30,
                  hierarchy: pointArr,
                  perPositionHeight: true,
                  material: Cesium.Color.ORANGE.withAlpha(1.0)
              }
          })
        });
        $('#getSkyline2D').click(function () {
          //获取二维天际线对象,兼容webgpu
          let object = skyline.getSkyline2D();
        
          //用echarts绘制二维天际线
          let myChart = echarts.init(document.getElementById("map"));
          let option = {
            backgroundColor: "rgba(73,139,156,0.9)",
            title: {
                text: "二维天际线"
            },

            tooltip: {
                trigger: "axis"
            },

            calculable: true,
            xAxis: [
                {
                    type: "category",
                    boundaryGap: false,
                    data: object.x,
                    show: false
                }
            ],

            yAxis: [
                {
                    type: "value",
                    min: 0,
                    max: 1
                }
            ],

            series: [
                {
                    name: "",
                    type: "line",
                    data: object.y
                }
            ]
          };
          myChart.setOption(option);
          $("#map").show();
        });
      }

      loadModel();
    
    }
    if (typeof Cesium !== "undefined") {
      //window.startupCalled = true;
      onload(Cesium,SuperMapCesiumPlugin);
    }
  </script>
</body>

</html>
