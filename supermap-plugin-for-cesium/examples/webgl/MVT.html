<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <title>新架构插件-ESM</title>
  <script type="text/javascript" src="./js/jquery.min.js"></script>
  <!-- 引入原生Cesium和SuperMap插件 -->
  <link href="../../Build/Cesium-1.133/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="../../Build/Cesium-1.133/Cesium/Cesium.js"></script>
  <script src="../../Build/SuperMapCesiumPlugin/SuperMapCesiumPlugin.js"></script>

  <style>
    html,
    body,
    #Container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    #toolbar{
            position: absolute;
            left: 2rem;
            top: 2rem;
            width:  15rem;
            height: 10rem;
            background-color: antiquewhite;
        }
        .func{
            width:  15rem;
            height: 4rem;
            background-color: aliceblue;
        }
        .unfinished{
            width:  15rem;
            height: 5rem;
            background-color: rgba(172, 0, 0, 0.3);
        }
  </style>
</head>

<body>
  <div id="Container"></div>
  <div id="toolbar">
    <div class="func">
      <p>1.mvt的加载,显示,删除</p>
      <p>2.mvt的点选</p>
    </div>
    <div class="func">
        <button class="foo" type="button" id="addMap">addMap</button>
        <button class="foo" type="button" id="removeMap">removeMap</button>
    </div>
</div>
  <script>
    
    function onload(Cesium, SuperMapCesiumPlugin) {
      if (SuperMapCesiumPlugin === undefined) {
        return;
      }

      const viewer = new Cesium.Viewer("Container", {});
      const scene = viewer.scene;
      scene.logarithmicDepthBuffer = true;

      //全局变量
      //用于添加超图提供的接口类
      var iViewer = new SuperMapCesiumPlugin.CesiumViewer({scene});
      var iScene = iViewer.scene;
      var iMvtMap;
      var mvtUrl = "http://172.16.120.191:8090/iserver/services/map-mvt-std_mvt_jingjin/restjsr/v1/vectortile/maps/%E4%BA%AC%E6%B4%A5%E5%9C%B0%E5%8C%BA%E5%9C%B0%E5%9B%BE";
        
   
      function loadMvt(superMapScene, mvtUrl){
        return superMapScene.addVectorTilesMap({
            url: mvtUrl,
            name: "testMVT",
        });
      }

      function removeMap(superMapScene){
        superMapScene.removeVectorTilesMap("testMVT");
      }

      function locateMvt(mvtMap){
        var layerReadyPromise = mvtMap.readyPromise;
        layerReadyPromise.then(function(data){
          var bounds = mvtMap.rectangle;
          scene.camera.setView({
            destination: new Cesium.Cartesian3.fromRadians(
              (bounds.east + bounds.west) * 0.5,
              (bounds.north + bounds.south) * 0.5,
              1000
            ),
            orientation: {
              heading: 0,
              roll: 0,
            },
          });
        });
      }
    
      $("#addMap").on("click", function () {
        $("#loadingbar").remove();
        iMvtMap = loadMvt(iScene, mvtUrl);
        locateMvt(iMvtMap);
      });

      $("#removeMap").on("click", function () {
         removeMap(iScene);
      });
    }
    document.addEventListener("DOMContentLoaded", function () {
      console.log("加载成功");
      if (typeof Cesium !== "undefined") {
        onload(Cesium, SuperMapCesiumPlugin);
      }
    })
  </script>
</body>

</html>
