<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <title>MVT文字贴地形</title>
  <script type="text/javascript" src="./js/jquery.min.js"></script>
  <!-- 引入原生Cesium和SuperMap插件 -->
  <link href="../../Build/Cesium-1.133/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="../../Build/Cesium-1.133/Cesium/Cesium.js"></script>
  <script src="../../Build/SuperMapCesiumPlugin/SuperMapCesiumPlugin.js"></script>

  <style>
    html,
    body,
    #Container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    #toolbar{
            position: absolute;
            left: 2rem;
            top: 2rem;
            width:  15rem;
            height: 10rem;
            background-color: antiquewhite;
        }
        .func{
            width:  15rem;
            height: 4rem;
            background-color: aliceblue;
        }
        .unfinished{
            width:  15rem;
            height: 5rem;
            background-color: rgba(172, 0, 0, 0.3);
        }
  </style>
</head>

<body>
  <div id="Container"></div>
  <div id="toolbar">
    <div class="func">
        <button class="foo" type="button" id="mvt-terrain">mvt-terrain</button>
        <button class="foo" type="button" id="terrain-mvt">terrain-mvt</button>
    </div>
    <div class="func">
        <button class="foo" type="button" id="mvtVisible">mvt显隐</button>
        <button class="foo" type="button" id="removeMvt">mvt删除</button>
        <button class="foo" type="button" id="addMvt">mvt添加</button>
    </div>
    <div class="func">
        <button class="foo" type="button" id="printView">输出视图</button>
        <button class="foo" type="button" id="defaultView">默认视图</button>
    </div>
  
</div>
  <script>
    /**
     * 本范例显示mvt文字贴地形功能
     * 1. 该功能不受mvt，地形的加载顺序影响
     * 2. 该功能能适应mvt显隐变化，以及mvt的添加删除变化
     */ 
    function onload(Cesium, SuperMapCesiumPlugin) {
      if (SuperMapCesiumPlugin === undefined) {
        return;
      }

      const viewer = new Cesium.Viewer("Container", {});
      const scene = viewer.scene;
      scene.globe.depthTestAgainstTerrain = true;
      scene.logarithmicDepthBuffer = true;

      //用于添加超图提供的接口类
      var iViewer = new SuperMapCesiumPlugin.CesiumViewer({scene});
      var iScene = iViewer.scene;
  
      $("#loadingbar").remove();
      

      function addTerrain(){
          //添加地形
          const iTerrainProvider = new SuperMapCesiumPlugin.SuperMapTerrainProvider({
              url : 'http://172.16.120.191:8090/iserver/services/3D-ZhuFengDiXingYingXiang/rest/realspace/datas/srtm_54_07@zhufeng',
              isSct : true,//地形服务源自SuperMap iServer发布时需设置isSct为true
              invisibility:true
          })
          viewer.terrainProvider = iTerrainProvider;
      }

      function loadMvt(superMapScene){
          var vectorUrl = "http://172.16.120.191:8090/iserver/services/map-mvt-std_mvt_zhufeng_text_clamp_terrain/restjsr/v1/vectortile/maps/text%40zhufeng";
          mvtMap = superMapScene.addVectorTilesMap({
              url: vectorUrl,
              canvasWidth: 512,
              name: 'testMVT'
          });
          return mvtMap;
      }

      //先加载mvt，再加载倾斜
      function testMvtTerrainOrder(){
         return new Promise(resolve=>{
            const mvtMap = loadMvt(iScene);
            const readyPromise = mvtMap.readyPromise;
            readyPromise.then(function(){
                locateCurrentLayer();
                addTerrain();
                resolve(true);
             })
         })
         
      }
        //先加载倾斜，再加载mvt
      function testTerrainMvtOrder(){
          return new Promise(resolve => {
              addTerrain();
              loadMvt();
              SuperMap3D.when(mvtMap.readyPromise, function(){
                  locateCurrentLayer();
                  resolve(true)
              })
          })
      }

      function locateCurrentLayer(){
          scene.camera.setView({
            destination:new Cesium.Cartesian3 (342731.84615316783, 5657592.450975579, 2945470.2799408743),
                  orientation:{
                     heading: 1.113845380273574,
                     pitch: -0.3321702825384656,
                     roll: 6.282987061212118
                   }
          })
      }
      $("#mvt-terrain").click(function(){
          testMvtTerrainOrder().then(()=>{
              addButtonEvent();
          })
      })
      $("#terrain-mvt").click(function(){
          testMvtTerrainOrder().then(()=>{
              addButtonEvent();
          })
      })
      function addButtonEvent(){
          $('#loadingbar').remove();
          $("#mvtVisible").click(function(){
              mvtMap.show = !mvtMap.show;
          })
          $("#addMvt").click(function(){
              loadMvt(iScene);
          })
          $("#removeMvt").click(function(){
              iScene.removeVectorTilesMap("testMVT");
              mvtMap = undefined;
          })
          
          $("#defaultView").click(function(){
             locateCurrentLayer();
          })
          $("#printView").click(function(){
              let camera = scene.camera;
              console.log(`
                  destination:new SuperMap3D.Cartesian3 (${camera.position.x}, ${camera.position.y}, ${camera.position.z}),
                  orientation:{
                     heading: ${camera.heading},
                     pitch: ${camera.pitch},
                     roll: ${camera.roll}
                   }
              `)
          })
      }
      
        var iMvtMap;
        var mvtUrl =
          "http://localhost:8090/iserver/services/map-mvt-std_mvt_jingjin/restjsr/v1/vectortile/maps/%E4%BA%AC%E6%B4%A5%E5%9C%B0%E5%8C%BA%E5%9C%B0%E5%9B%BE";
        
          $("#addMap").on("click", function () {
          iMvtMap = iScene.addVectorTilesMap({
            url: mvtUrl,
            name: "testMVT",
          
          });


          var layerReadyPromise = iMvtMap.readyPromise;
          layerReadyPromise.then(function(data){
            var bounds = iMvtMap.rectangle;
            scene.camera.setView({
              destination:new Cesium.Cartesian3 (331943.23104458407, 5649880.955185908, 2951327.3042373043),
                  orientation:{
                     heading: 1.1196336441136516,
                     pitch: -0.3321697765593661,
                     roll: 6.2830096142706475
                   }
            });
          });
        });
    }
    document.addEventListener("DOMContentLoaded", function () {
      console.log("加载成功");
      if (typeof Cesium !== "undefined") {
        onload(Cesium, SuperMapCesiumPlugin);
      }
    })
  </script>
</body>

</html>
